name: Deploy Static Site

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build Site (Generate HTML)
        run: |
          cp index.html
          cp -r assets public/assets

      - name:
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
