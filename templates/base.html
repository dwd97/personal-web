<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    ></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
          ],
          throwOnError: false,
        });
      });
    </script>
    <title>{{TITLE}}</title>
    <link
      id="hljs-light"
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    />

    <link
      id="hljs-dark"
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
      disabled
    />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
    ></script>

    <script defer>
      document.addEventListener("DOMContentLoaded", () => {
        document
          .querySelectorAll("pre code")
          .forEach((el) => hljs.highlightElement(el));
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("table").forEach((table) => {
          // skip if already wrapped
          if (table.parentElement.classList.contains("table-wrapper")) return;

          const wrapper = document.createElement("div");
          wrapper.className = "table-wrapper";

          table.parentNode.insertBefore(wrapper, table);
          wrapper.appendChild(table);
        });
      });
    </script>
  </head>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Wrap code blocks FIRST
      document.querySelectorAll(".code-block pre").forEach((pre) => {
        if (pre.parentElement.classList.contains("code-scroll")) return;

        const scroll = document.createElement("div");
        scroll.className = "code-scroll";

        pre.parentNode.insertBefore(scroll, pre);
        scroll.appendChild(pre);
      });

      // THEN run highlight.js
      document.querySelectorAll("pre code").forEach((el) => {
        hljs.highlightElement(el);
      });
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".code-block").forEach((block) => {
        const code = block.querySelector("pre code");
        const header = block.querySelector(".code-header");

        if (!code || !header) return;

        const button = document.createElement("button");
        button.className = "copy-btn";
        button.innerHTML = `
      <svg class="copy-icon" viewBox="0 0 24 24" width="14" height="14">
        <path fill="currentColor"
          d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14
          c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0
          16H8V7h11v14z"/>
      </svg>
      <span class="copy-text">Copy</span>
    `;

        button.addEventListener("click", async () => {
          await navigator.clipboard.writeText(code.innerText);

          button.querySelector(".copy-text").textContent = "Copied";

          setTimeout(() => {
            button.querySelector(".copy-text").textContent = "Copy";
          }, 1400);
        });

        header.appendChild(button);
      });
    });
  </script>
  <body>
    <header class="site-header">
      <div class="container">
        <nav class="nav">
          <a class="logo" href="/">Personal-Web</a>

          <div class="nav-actions">
            <button id="menu-toggle" class="menu-toggle" aria-label="Open menu">
              <svg width="22" height="22" viewBox="0 0 24 24">
                <path
                  fill="currentColor"
                  d="M3 6h18M3 12h18M3 18h18"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>

            <button
              id="theme-toggle"
              class="theme-toggle"
              aria-label="Toggle dark mode"
            >
              <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24">
                <path
                  fill="currentColor"
                  d="M21 12.79A9 9 0 0 1 11.21 3
                 7 7 0 1 0 21 12.79z"
                />
              </svg>

              <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24">
                <path
                  fill="currentColor"
                  d="M12 4V2M12 22v-2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41
                 M2 12h2M22 12h-2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41
                 M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"
                />
              </svg>
            </button>
          </div>

          <div class="nav-links" id="mobile-menu">
            <a href="/">Home</a>
            <a href="/about/">About</a>
            <a href="/contact/">Contact</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="container">{{CONTENT}}</main>

    <footer class="container footer">{{YEAR}} © David Krejci</footer>

    <script>
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");
      const lightHL = document.getElementById("hljs-light");
      const darkHL = document.getElementById("hljs-dark");

      function setTheme(theme) {
        root.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);

        if (theme === "dark") {
          darkHL.removeAttribute("disabled");
          lightHL.setAttribute("disabled", "true");
        } else {
          lightHL.removeAttribute("disabled");
          darkHL.setAttribute("disabled", "true");
        }
      }

      function initTheme() {
        const saved = localStorage.getItem("theme");

        if (saved) {
          setTheme(saved);
          return;
        }

        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        setTheme(prefersDark ? "dark" : "light");
      }

      toggle.addEventListener("click", () => {
        const current = root.getAttribute("data-theme");
        setTheme(current === "dark" ? "light" : "dark");
      });

      initTheme();
    </script>
    <script>
      // mobile menu toggle
      const menuToggle = document.getElementById("menu-toggle");
      const mobileMenu = document.getElementById("mobile-menu");

      menuToggle.addEventListener("click", () => {
        mobileMenu.classList.toggle("open");
      });
    </script>
  </body>
</html>
