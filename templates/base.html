<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    ></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
          ],
          throwOnError: false,
        });
      });
    </script>
    <title>{{TITLE}}</title>
    <link
      id="hljs-light"
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    />

    <link
      id="hljs-dark"
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
      disabled
    />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
    ></script>

    <script defer>
      document.addEventListener("DOMContentLoaded", () => {
        document
          .querySelectorAll("pre code")
          .forEach((el) => hljs.highlightElement(el));
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("table").forEach((table) => {
          // skip if already wrapped
          if (table.parentElement.classList.contains("table-wrapper")) return;

          const wrapper = document.createElement("div");
          wrapper.className = "table-wrapper";

          table.parentNode.insertBefore(wrapper, table);
          wrapper.appendChild(table);
        });
      });
    </script>
  </head>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Wrap code blocks FIRST
      document.querySelectorAll(".code-block pre").forEach((pre) => {
        if (pre.parentElement.classList.contains("code-scroll")) return;

        const scroll = document.createElement("div");
        scroll.className = "code-scroll";

        pre.parentNode.insertBefore(scroll, pre);
        scroll.appendChild(pre);
      });

      // THEN run highlight.js
      document.querySelectorAll("pre code").forEach((el) => {
        hljs.highlightElement(el);
      });
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".code-block").forEach((block) => {
        const code = block.querySelector("pre code");
        const header = block.querySelector(".code-header");

        if (!code || !header) return;

        const button = document.createElement("button");
        button.className = "copy-btn";
        button.innerHTML = `
      <svg class="copy-icon" viewBox="0 0 24 24" width="14" height="14">
        <path fill="currentColor"
          d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14
          c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0
          16H8V7h11v14z"/>
      </svg>
      <span class="copy-text">Copy</span>
    `;

        button.addEventListener("click", async () => {
          await navigator.clipboard.writeText(code.innerText);

          button.querySelector(".copy-text").textContent = "Copied";

          setTimeout(() => {
            button.querySelector(".copy-text").textContent = "Copy";
          }, 1400);
        });

        header.appendChild(button);
      });
    });
  </script>
  <body>
    <header class="site-header">
      <div class="container">
        <nav class="nav">
          <a class="logo" href="/">davidkrejci.dev</a>

          <div class="nav-actions">
            <button id="menu-toggle" class="menu-toggle" aria-label="Open menu">
              <svg width="22" height="22" viewBox="0 0 24 24">
                <path
                  fill="currentColor"
                  d="M3 6h18M3 12h18M3 18h18"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>

            <button
              id="theme-toggle"
              class="theme-toggle"
              aria-label="Toggle dark mode"
            >
              <!-- MOON — bold, centered, visible at small sizes -->
              <svg id="icon-moon" viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M21 12.5A8.5 8.5 0 1 1 11.5 3
         6.5 6.5 0 1 0 21 12.5z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

              <!-- SUN — same visual weight -->
              <svg id="icon-sun" viewBox="0 0 24 24" width="20" height="20">
                <circle
                  cx="12"
                  cy="12"
                  r="4.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.6"
                />
                <g
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                >
                  <line x1="12" y1="2.5" x2="12" y2="5.5" />
                  <line x1="12" y1="18.5" x2="12" y2="21.5" />
                  <line x1="2.5" y1="12" x2="5.5" y2="12" />
                  <line x1="18.5" y1="12" x2="21.5" y2="12" />
                  <line x1="5.2" y1="5.2" x2="7.4" y2="7.4" />
                  <line x1="16.6" y1="16.6" x2="18.8" y2="18.8" />
                  <line x1="5.2" y1="18.8" x2="7.4" y2="16.6" />
                  <line x1="16.6" y1="7.4" x2="18.8" y2="5.2" />
                </g>
              </svg>
            </button>
          </div>

          <div class="nav-links" id="mobile-menu">
            <a href="/">Home</a>
            <a href="/about/">About</a>
            <a href="/contact/">Contact</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="container">{{CONTENT}}</main>

    <footer class="container footer">{{YEAR}} © David Krejci</footer>

    <script>
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");
      const lightHL = document.getElementById("hljs-light");
      const darkHL = document.getElementById("hljs-dark");

      function setTheme(theme) {
        root.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);

        if (theme === "dark") {
          darkHL.removeAttribute("disabled");
          lightHL.setAttribute("disabled", "true");
        } else {
          lightHL.removeAttribute("disabled");
          darkHL.setAttribute("disabled", "true");
        }
      }

      function initTheme() {
        const saved = localStorage.getItem("theme");

        if (saved) {
          setTheme(saved);
          return;
        }

        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        setTheme(prefersDark ? "dark" : "light");
      }

      toggle.addEventListener("click", () => {
        const current = root.getAttribute("data-theme");
        setTheme(current === "dark" ? "light" : "dark");
      });

      initTheme();
    </script>
    <script>
      // mobile menu toggle
      const menuToggle = document.getElementById("menu-toggle");
      const mobileMenu = document.getElementById("mobile-menu");

      menuToggle.addEventListener("click", () => {
        mobileMenu.classList.toggle("open");
      });
    </script>
    <div id="imgModal" class="modal">
      <span class="close">&times;</span>
      <img class="modal-content" id="img01" />
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const modal = document.getElementById("imgModal");
        const modalImg = document.getElementById("img01");

        // Global listener for clicks on expandable images
        document.addEventListener("click", function (e) {
          const link = e.target.closest(".img-expand-link");
          if (link) {
            e.preventDefault(); // Stop from opening in new tab
            modal.style.display = "flex";
            // Use the link's href (the high-res original) for the modal
            modalImg.src = link.getAttribute("href");
          }
        });

        // Close when clicking the 'X' or anywhere outside the image
        modal.onclick = function (e) {
          if (e.target !== modalImg) {
            modal.style.display = "none";
          }
        };
      });
    </script>
  </body>
</html>
